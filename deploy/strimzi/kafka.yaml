apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: inventory-kafka
spec:
  kafka:
    version: 3.7.0
    replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
  zookeeper:
    replicas: 1
