apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: inventory-worker
spec:
  scaleTargetRef:
    name: inventory-worker
  minReplicaCount: 1
  maxReplicaCount: 10
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: inventory-worker
        topic: inv.order-events
        lagThreshold: "5"
